<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - NovaConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #475569;
      font-size: 14px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 8px;
    }

    .input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .input::placeholder {
      color: #94a3b8;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
    }

    .submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      text-align: center;
    }

    .message.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .otp-input {
      width: 50px;
      height: 50px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
    }

    .otp-input:focus {
      outline: none;
      border-color: #3b82f6;
      background: white;
    }

    .timer {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-top: 10px;
    }

    .resend-link {
      color: #3b82f6;
      cursor: pointer;
      text-decoration: underline;
    }

    .resend-link.disabled {
      color: #94a3b8;
      cursor: not-allowed;
      text-decoration: none;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      font-size: 18px;
    }

    .password-toggle:hover {
      color: #334155;
    }

    .password-requirements {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
      padding-left: 4px;
    }

    .password-requirements li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Step 1: Enter Email -->
    <div id="step1" class="step active">
      <div class="header">
        <h1 class="title">Forgot Password?</h1>
        <p class="subtitle">Enter your registered email to reset your password</p>
      </div>

      <div id="message1" class="message" style="display: none;"></div>

      <form id="emailForm">
        <div class="form-group">
          <label class="label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="input" 
            placeholder="Enter your registered email"
            required
          >
        </div>

        <button type="submit" class="submit-btn" id="sendOtpBtn">Send OTP</button>
      </form>

      <div class="back-link">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>

    <!-- Step 2: Verify OTP -->
    <div id="step2" class="step">
      <div class="header">
        <h1 class="title">Verify OTP</h1>
        <p class="subtitle">Enter the 6-digit code sent to <span id="emailDisplay"></span></p>
      </div>

      <div id="message2" class="message" style="display: none;"></div>

      <form id="otpForm">
        <div class="otp-inputs">
          <input type="text" maxlength="1" class="otp-input" data-index="0" />
          <input type="text" maxlength="1" class="otp-input" data-index="1" />
          <input type="text" maxlength="1" class="otp-input" data-index="2" />
          <input type="text" maxlength="1" class="otp-input" data-index="3" />
          <input type="text" maxlength="1" class="otp-input" data-index="4" />
          <input type="text" maxlength="1" class="otp-input" data-index="5" />
        </div>

        <div class="timer">
          <span id="timer">OTP expires in <strong>5:00</strong></span>
        </div>

        <button type="submit" class="submit-btn" style="margin-top: 20px;">Verify OTP</button>
      </form>

      <div class="back-link">
        <span class="resend-link disabled" id="resendLink">Resend OTP</span>
      </div>
    </div>

    <!-- Step 3: Reset Password -->
    <div id="step3" class="step">
      <div class="header">
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Create a new password for your account</p>
      </div>

      <div id="message3" class="message" style="display: none;"></div>

      <form id="resetForm">
        <div class="form-group">
          <label class="label">New Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="newPassword" 
              class="input" 
              placeholder="Enter new password"
              style="padding-right: 44px;"
              required
            >
            <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)">
              👁️
            </button>
          </div>
          <ul class="password-requirements">
            <li>At least 6 characters long</li>
            <li>Contains letters and numbers</li>
          </ul>
        </div>

        <div class="form-group">
          <label class="label">Confirm Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              class="input" 
              placeholder="Re-enter new password"
              style="padding-right: 44px;"
              required
            >
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Reset Password</button>
      </form>

      <div class="back-link">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    let userEmail = '';
    let timerInterval;
    let timeLeft = 300; // 5 minutes in seconds

    // Step 1: Send OTP
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('sendOtpBtn');
      
      btn.disabled = true;
      btn.textContent = 'Sending...';
      
      try {
        const response = await fetch('http://localhost:3000/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          userEmail = email;
          showMessage('message1', data.message, 'success');
          setTimeout(() => {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('emailDisplay').textContent = email;
            startTimer();
          }, 1500);
        } else {
          showMessage('message1', data.message, 'error');
        }
      } catch (error) {
        showMessage('message1', 'Server error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    });

    // Step 2: Verify OTP
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const otpInputs = document.querySelectorAll('.otp-input');
      const otp = Array.from(otpInputs).map(input => input.value).join('');
      
      if (otp.length !== 6) {
        showMessage('message2', 'Please enter complete OTP', 'error');
        return;
      }
      
      try {
        const response = await fetch('http://localhost:3000/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, otp })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('message2', data.message, 'success');
          clearInterval(timerInterval);
          setTimeout(() => {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
          }, 1500);
        } else {
          showMessage('message2', data.message, 'error');
        }
      } catch (error) {
        showMessage('message2', 'Server error. Please try again.', 'error');
      }
    });

    // Step 3: Reset Password
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Validate password
      const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;
      if (!passwordRegex.test(newPassword)) {
        showMessage('message3', 'Password must be at least 6 characters and contain letters and numbers.', 'error');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showMessage('message3', 'Passwords do not match', 'error');
        return;
      }
      
      try {
        const response = await fetch('http://localhost:3000/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, newPassword })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('message3', data.message, 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage('message3', data.message, 'error');
        }
      } catch (error) {
        showMessage('message3', 'Server error. Please try again.', 'error');
      }
    });

    // OTP Input handling
    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
      
      // Only allow numbers
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
      });
    });

    // Timer
    function startTimer() {
      timeLeft = 300;
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer').innerHTML = '<span style="color: #dc2626;">OTP expired</span>';
          document.getElementById('resendLink').classList.remove('disabled');
        }
        
        if (timeLeft === 120) {
          document.getElementById('resendLink').classList.remove('disabled');
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timer').innerHTML = 
        `OTP expires in <strong>${minutes}:${seconds.toString().padStart(2, '0')}</strong>`;
    }

    // Resend OTP
    document.getElementById('resendLink').addEventListener('click', async () => {
      if (document.getElementById('resendLink').classList.contains('disabled')) return;
      
      document.getElementById('resendLink').classList.add('disabled');
      
      try {
        const response = await fetch('http://localhost:3000/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('message2', 'OTP has been resent to your email', 'success');
          startTimer();
          // Clear OTP inputs
          otpInputs.forEach(input => input.value = '');
          otpInputs[0].focus();
        } else {
          showMessage('message2', data.message, 'error');
          document.getElementById('resendLink').classList.remove('disabled');
        }
      } catch (error) {
        showMessage('message2', 'Failed to resend OTP', 'error');
        document.getElementById('resendLink').classList.remove('disabled');
      }
    });

    // Helper functions
    function showMessage(elementId, message, type) {
      const messageEl = document.getElementById(elementId);
      messageEl.textContent = message;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';
      
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        button.textContent = '🙈';
      } else {
        input.type = 'password';
        button.textContent = '👁️';
      }
    }
  </script>
</body>
</html>
